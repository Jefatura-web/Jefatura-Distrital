<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Actividades de inspectores por nivel - Jefatura Distrital Quilmes" />
  <title>Nivel | Jefatura Distrital Quilmes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>

  <div class="topbar" role="banner">
    <span>Dirección General de Cultura y Educación — Provincia de Buenos Aires</span>
  </div>

  <div class="nivel-page">
    <a href="/" class="nivel-back-link">← Volver a inicio</a>

    <div class="nivel-header">
      <span class="nivel-icono" id="nivel-icono" aria-hidden="true">📚</span>
      <h1 id="nivel-titulo">Cargando…</h1>
    </div>

    <!-- Resumen visual del año (barras por mes, clickeables) -->
    <div id="nivel-resumen"></div>

    <!-- Filtros de actividades -->
    <div class="nivel-filtros" aria-label="Filtros de actividades">
      <label class="nivel-nivel-filtro">
        <span>Nivel educativo</span>
        <select id="nivel-filtro-nivel" aria-label="Filtrar por nivel educativo">
          <option value="todos">Todos los niveles</option>
          <option value="inicial">Nivel Inicial</option>
          <option value="primaria">Nivel Primario</option>
          <option value="secundaria">Nivel Secundario</option>
          <option value="tecnica">Educación Técnica</option>
          <option value="agraria">Educación Agraria</option>
          <option value="superior">Nivel Superior</option>
          <option value="especial">Educación Especial</option>
          <option value="pcyps">PCYPS</option>
          <option value="dejayam">DEJAYAM</option>
          <option value="ed-fisica">Educación Física</option>
          <option value="ed-artistica">Educación Artística</option>
        </select>
      </label>
      <label class="nivel-filtro-wrap">
        <span class="nivel-filtro-icon" aria-hidden="true">🔍</span>
        <input type="search" id="nivel-filtro"
               placeholder="Buscar por escuela, inspector, título o descripción…"
               autocomplete="off" aria-label="Buscar actividades" />
      </label>
      <label class="nivel-inspector-filtro">
        <span>Inspector/a</span>
        <select id="nivel-filtro-inspector" aria-label="Filtrar por inspector">
          <option value="">Todos los inspectores</option>
        </select>
      </label>
      <label class="nivel-anio-filtro">
        <span>Año</span>
        <select id="nivel-filtro-anio" aria-label="Filtrar por año">
          <option value="">Todos los años</option>
        </select>
      </label>
      <button id="nivel-filtros-limpiar" class="nivel-limpiar-filtros" type="button">Limpiar filtros y fechas</button>
    </div>

    <p id="nivel-resultados" class="nivel-resultados" aria-live="polite"></p>

    <!-- Pestañas de mes -->
    <div class="nivel-meses" id="nivel-meses" role="tablist" aria-label="Seleccionar mes"></div>

    <!-- Grilla de actividades -->
    <div id="nivel-contenido" role="tabpanel" aria-live="polite" aria-busy="true">
      <div class="nivel-loading">Cargando actividades…</div>
    </div>
    <nav class="activity-pagination" aria-label="Paginación de actividades">
      <button id="activity-page-prev" type="button" disabled>← Anteriores</button>
      <span id="activity-page-status" role="status" aria-live="polite"></span>
      <button id="activity-page-next" type="button" disabled>Siguientes →</button>
    </nav>
  </div>

  <div id="nivel-detalle-modal" aria-hidden="true">
    <div class="nivel-detalle-content" role="dialog" aria-modal="true" aria-labelledby="detalle-titulo">
      <button id="nivel-detalle-cerrar" class="nivel-detalle-cerrar" type="button" aria-label="Cerrar">×</button>
      <div id="nivel-detalle-body"></div>
    </div>
  </div>

  <script type="module" src="js/actividades.js"></script>
</body>
</html>
