services:
  - type: web
    name: jefatura-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_TOKEN
        value: Espora105
      - key: CORS_ORIGIN
        value: https://jefatura.netlify.app
